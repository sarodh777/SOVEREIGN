<!doctype html>
<html lang="en" data-theme="neon-quantum" data-font="Inter">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VaultChain - Secure Blockchain Banking & Governance Platform" />
    <meta name="theme-color" content="#050720" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vaultchain-logo.svg" />
    
    <!-- Google Fonts: Inter, Poppins, Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    
    <!-- Page Title -->
    <title>VaultChain - Secure Banking Platform</title>

    <!-- Instant Theme and Font Initialization (Anti-Flash) -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('vc_theme') || 'neon-quantum';
          var font = localStorage.getItem('vc_font') || 'Inter';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-font', font);
        } catch (e) {}
      })();
    </script>
    
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        width: 100%;
      }

      body {
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background-color 200ms ease, color 200ms ease;
      }

      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <!-- Main React App Root -->
    <div id="root"></div>

    <!-- React and Vite Module -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- Loading Fallback -->
    <noscript>
      <div style="
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #050720;
        color: #F8FAFC;
        font-family: 'Inter', sans-serif;
        flex-direction: column;
        gap: 20px;
      ">
        <h1 style="font-size: 32px; font-weight: 700;">VAULTCHAIN</h1>
        <p>JavaScript is required to run this application.</p>
        <p style="color: #A0AEC0; font-size: 14px;">Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
  </body>
</html>
