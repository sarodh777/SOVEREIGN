<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="vc-theme-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#356BFF" />
      <stop offset="50%" stop-color="#713BFF" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="vc-dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111B57" />
      <stop offset="100%" stop-color="#050B2E" />
    </linearGradient>
    <filter id="vc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Shield Outer Frame -->
  <path d="M32 4 L56 16 V36 L32 60 L8 36 V16 L32 4 Z" 
        stroke="url(#vc-theme-grad)" 
        stroke-width="3" 
        stroke-linejoin="round"
        fill="url(#vc-dark-grad)" />

  <!-- Inner Vault Facet Lines -->
  <path d="M32 4 L32 30" stroke="url(#vc-theme-grad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M56 16 L32 30" stroke="url(#vc-theme-grad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M8 16 L32 30" stroke="url(#vc-theme-grad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M32 60 L32 38" stroke="url(#vc-theme-grad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M8 36 L24 34" stroke="url(#vc-theme-grad)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M56 36 L40 34" stroke="url(#vc-theme-grad)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Core Security Vault Node / Diamond -->
  <polygon points="32,20 42,30 32,40 22,30" 
           fill="url(#vc-theme-grad)" 
           filter="url(#vc-glow)" />

  <!-- Central Keyway Hole -->
  <circle cx="32" cy="29" r="2.5" fill="#050B2E" />
  <path d="M30.8 29.5 L33.2 29.5 L34 35 L30 35 Z" fill="#050B2E" />
</svg>